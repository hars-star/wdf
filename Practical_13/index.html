<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13: PHP JSON API & AJAX/Fetch-Based CRUD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="crud-container">
        <header class="header-row">
            <div>
                <h1>AJAX / Fetch API Student Data Center</h1>
                <p style="color: var(--text-muted);">Perform dynamic Create, Read, Update, and Delete operations purely via JavaScript Fetch API without full page reloads.</p>
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Student (AJAX)</button>
        </header>

        <!-- Filter & Live Debounced Search -->
        <div class="filter-card">
            <input type="text" id="ajaxSearch" placeholder="Live Search: Type to filter records instantly (Debounced 300ms)...">

            <select id="ajaxDeptFilter">
                <option value="">All Engineering Departments</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electronics & Comm.">Electronics & Communication</option>
                <option value="Mechanical Engg">Mechanical Engineering</option>
            </select>

            <span id="recordCountBadge" class="badge badge-active" style="padding: 0.5rem 0.8rem;">Loading...</span>
        </div>

        <!-- Asynchronous Data Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Enrollment</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>GPA</th>
                        <th>Status</th>
                        <th>AJAX Actions</th>
                    </tr>
                </thead>
                <tbody id="ajaxTableBody">
                    <!-- Populated dynamically by ajax_crud.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Add Student (AJAX) -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Add Student via REST API</h2>
                <button type="button" class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="addStudentForm">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Enrollment *</label>
                        <input type="text" name="enrollment_no" required placeholder="e.g. 23IT099">
                    </div>
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" name="name" required placeholder="Full Name">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="email@studenthub.com">
                    </div>
                    <div class="form-group">
                        <label>Mobile *</label>
                        <input type="tel" name="mobile" required placeholder="10-digit number">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Department *</label>
                        <select name="department" required>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics & Comm.">Electronics & Communication</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Course *</label>
                        <select name="course" required>
                            <option value="B.Tech IT">B.Tech IT</option>
                            <option value="B.Tech CE">B.Tech CE</option>
                            <option value="B.Tech CSE">B.Tech CSE</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Year *</label>
                        <select name="year" required>
                            <option value="1">Year 1</option>
                            <option value="2">Year 2</option>
                            <option value="3" selected>Year 3</option>
                            <option value="4">Year 4</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>GPA *</label>
                        <input type="number" step="0.01" name="gpa" value="3.50" required>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit via API</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Edit Student (AJAX) -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Update Student via API</h2>
                <button type="button" class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editStudentForm">
                <input type="hidden" id="edit_id" name="id">

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Enrollment *</label>
                        <input type="text" id="edit_enrollment" name="enrollment_no" required>
                    </div>
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="edit_name" name="name" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="edit_email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile *</label>
                        <input type="tel" id="edit_mobile" name="mobile" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Department *</label>
                        <select id="edit_dept" name="department" required>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics & Comm.">Electronics & Communication</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="edit_status" name="status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Course *</label>
                        <input type="text" id="edit_course" name="course" required>
                    </div>
                    <div class="form-group">
                        <label>Year *</label>
                        <input type="number" id="edit_year" name="year" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>GPA *</label>
                    <input type="number" step="0.01" id="edit_gpa" name="gpa" required>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update via API</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ajax_crud.js"></script>
</body>
</html>
